name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check patch hygiene
        run: git diff --check

      - name: Scan committed content for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 \
            dir /repo --config=/repo/.gitleaks.toml --no-banner --redact

      - name: Install project and security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ghostmcp]' -e vendor/ghostmcp
          python -m pip install bandit pip-audit ruff

      - name: Reject critical Python defects
        run: python -m ruff check src tests --select E9,F63,F7,F82

      - name: Scan for high-severity static findings
        run: python -m bandit -q -lll -r src

      - name: Audit installed dependencies
        run: python -m pip_audit
