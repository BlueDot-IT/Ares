name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and release tools
        run: |
          python -m pip install --upgrade pip build twine cyclonedx-bom==7.3.0
          python -m pip install -e '.[dev,anthropic,gemini,ghostmcp]' -e vendor/ghostmcp

      - name: Verify release identity
        run: |
          PACKAGE_NAME="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$PACKAGE_NAME" = "bluedot-ares"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          test "$(python -c 'import ares; print(ares.__version__)')" = "$PACKAGE_VERSION"

      - name: Run release test gate
        run: |
          python -m pytest tests -q
          python -m compileall -q src/ares

      - name: Build and validate distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name 'bluedot_ares-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'bluedot_ares-*.tar.gz' -print -quit)"

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/ares-release-smoke
          . /tmp/ares-release-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test "$(ares --version)" = "${GITHUB_REF_NAME#v}"
          python -c "import importlib.metadata as m; assert m.version('bluedot-ares') == '${GITHUB_REF_NAME#v}'"
          ares doctor
          ares doctor --json | python -m json.tool >/dev/null
          ares support-bundle --out /tmp/ares-support-bundle.json
          python -m json.tool /tmp/ares-support-bundle.json >/dev/null
          ares dashboard --help
          ares-dashboard --help
          python -c "from typer.main import get_command; from ares.cli import app; run = get_command(app).commands['mission'].commands['run']; assert any('--approval-receipts' in getattr(param, 'opts', []) for param in run.params)"
          ares route --target 127.0.0.1 --prompt "safe local smoke test"
          ares training --out /tmp/ares-sft-smoke.jsonl --min-status final_response

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment \
            --output-format JSON \
            --output-reproducible \
            --output-file "dist/bluedot-ares-${GITHUB_REF_NAME}.cdx.json" \
            /tmp/ares-release-smoke/bin/python

      - name: Write release metadata and checksums
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          payload = {
              "project": project["name"],
              "product": "Ares",
              "version": project["version"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
          }
          Path("dist/release-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f dist/SHA256SUMS
          (
            cd dist
            sha256sum *.whl *.tar.gz *.cdx.json release-metadata.json > SHA256SUMS
          )

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/bluedot-ares-${{ github.ref_name }}.cdx.json

      - name: Upload Python distributions for optional PyPI publication
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete release payload
        uses: actions/upload-artifact@v7
        with:
          name: ares-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "Ares ${GITHUB_REF_NAME}" \
            --notes-file docs/releases/v1.1.0.md

  publish-pypi:
    if: github.repository == 'BlueDot-IT/Ares' && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bluedot-ares
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions-${{ github.ref_name }}
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
