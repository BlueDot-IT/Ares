name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          rm -rf dist build src/*.egg-info
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Smoke installed wheel
        run: |
          python -m venv /tmp/ares-release-smoke
          . /tmp/ares-release-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/ares-1.0.0-py3-none-any.whl
          ares --version
          ares doctor
          ares dashboard --help
          ares-dashboard --help
          ares route --target 127.0.0.1 --prompt "safe local smoke test"
          ares training --out /tmp/ares-sft-smoke.jsonl --min-status final_response

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ares-dist
          path: dist/*
