name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,anthropic,gemini,ghostmcp]' -e vendor/ghostmcp

      - name: Run tests
        run: python -m pytest tests -q

      - name: Compile package sources
        run: python -m compileall -q src/ares

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and validate distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name 'bluedot_ares-*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'bluedot_ares-*.tar.gz' -print -quit)"

      - name: Install built wheel and run CLI smoke checks
        run: |
          python -m venv /tmp/ares-wheel-smoke
          . /tmp/ares-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          EXPECTED_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(ares --version)" = "$EXPECTED_VERSION"
          python -c "import importlib.metadata as m; assert m.version('bluedot-ares') == '$EXPECTED_VERSION'"
          ares doctor
          ares doctor --json | python -m json.tool >/dev/null
          ares support-bundle --out /tmp/ares-support-bundle.json
          python -m json.tool /tmp/ares-support-bundle.json >/dev/null
          ares dashboard --help
          ares-dashboard --help
          python -c "from typer.main import get_command; from ares.cli import app; run = get_command(app).commands['mission'].commands['run']; assert any('--approval-receipts' in getattr(param, 'opts', []) for param in run.params)"
          ares route --target 127.0.0.1 --prompt "safe local smoke test"
          ares training --out /tmp/ares-sft-smoke.jsonl --min-status final_response

  windows-package-smoke:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install built wheel and run Windows CLI smoke checks
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          if (-not $wheel) { throw "Ares wheel was not built" }
          python -m pip install $wheel.FullName
          $env:APP_HOME = Join-Path $env:RUNNER_TEMP "ares-home"
          $expected = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $actual = ares --version
          if ($actual.Trim() -ne $expected.Trim()) { throw "Version mismatch: $actual != $expected" }
          python -c "import importlib.metadata as m; assert m.version('bluedot-ares') == '$($expected.Trim())'"
          ares doctor
          ares doctor --json | ConvertFrom-Json | Out-Null
          ares support-bundle --out (Join-Path $env:RUNNER_TEMP "ares-support-bundle.json")
          ares sessions
          ares dashboard --help
          ares tui --help
          python -c "from typer.main import get_command; from ares.cli import app; run = get_command(app).commands['mission'].commands['run']; assert any('--approval-receipts' in getattr(param, 'opts', []) for param in run.params)"
          python -c "import curses, ares.tui"
