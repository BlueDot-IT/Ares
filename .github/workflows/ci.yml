name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -e vendor/ghostmcp -e '.[dev]' '.[anthropic]' '.[gemini]' '.[ghostmcp]'

      - name: Run tests
        run: python -m pytest tests -q

      - name: Compile package sources
        run: python -m compileall src/ares

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel and run CLI smoke checks
        run: |
          python -m venv /tmp/ares-wheel-smoke
          . /tmp/ares-wheel-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          ares --version
          ares doctor
          ares route --target 127.0.0.1 --prompt "safe local smoke test"
          ares training --out /tmp/ares-sft-smoke.jsonl --min-status final_response
