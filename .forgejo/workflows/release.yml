name: Release artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  release:
    name: Build and attest release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev,anthropic,gemini,ghostmcp]' -e vendor/ghostmcp

      - name: Verify release
        run: python -m pytest tests -q

      - name: Build distributions
        run: python -m build

      - name: Write release metadata and checksums
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          printf '{"project":"ares","version":"%s","commit":"%s","ref":"%s"}\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "${GITHUB_REF}" > dist/release-metadata.json

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ares-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

