name: Security evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check patch hygiene
        run: git diff --check

      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 \
            dir /repo --config=/repo/.gitleaks.toml --no-banner --redact

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,anthropic,gemini,ghostmcp]' -e vendor/ghostmcp

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit
