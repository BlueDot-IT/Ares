[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluedot-ares"
version = "1.1.0"
description = "Ares operator-supervised security assessment runtime for authorized engagements"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jason O'Neal"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["security", "authorized-testing", "ai-agent", "assessment-runtime", "ghostmcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "jsonschema",
  "openai",
  "prompt_toolkit",
  "rich",
  "typer",
  "windows-curses; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/BlueDot-IT/Ares"
Documentation = "https://github.com/BlueDot-IT/Ares#readme"
Repository = "https://github.com/BlueDot-IT/Ares"
Issues = "https://github.com/BlueDot-IT/Ares/issues"
Changelog = "https://github.com/BlueDot-IT/Ares/blob/main/CHANGELOG.md"
Security = "https://github.com/BlueDot-IT/Ares/security/policy"

[project.optional-dependencies]
anthropic = ["anthropic"]
gemini = ["google-auth", "google-auth-oauthlib", "google-genai"]
ghostmcp = ["ghostmcp-server==0.2.0", "mcp>=1.28.1"]
dev = ["pytest", "build", "twine"]

[project.scripts]
ares = "ares.cli:app"
ares-dashboard = "ares.dashboard:dashboard_app"
ares-tui = "ares.tui:main"

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/ghostmcp"]
testpaths = ["tests", "vendor/ghostmcp/tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ares*", "lib*"]
