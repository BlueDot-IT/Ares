<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ares autonomous pentesting runtime banner</title>
  <desc id="desc">A dark technical banner for Ares showing model adapters, policy enforcement, tool registry, and evidence state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.48" stop-color="#101827"/>
      <stop offset="1" stop-color="#210B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 92) rotate(126) scale(520 360)">
      <stop stop-color="#FF4D6D" stop-opacity="0.42"/>
      <stop offset="0.48" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
