      <stop offset="0.52" stop-color="#A78BFA" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="32" fill="url(#glow)"/>

